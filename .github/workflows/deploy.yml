name: Deploy VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 43.128.68.220
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            ~/deploy.sh
